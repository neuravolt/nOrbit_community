<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NeuraVolt OS - Notification Sound Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .samples-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .sample-btn {
      background: #0c121e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      width: 100%;
    }

    .sample-btn:hover {
      background: #182235;
      border-color: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .sample-btn:active {
      transform: translateY(0);
    }

    .sample-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sample-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sample-desc {
      font-size: 11px;
      color: #94a3b8;
    }

    .play-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .sample-btn:hover .play-icon {
      transform: scale(1.1);
      background: #4f46e5;
    }

    .tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: #312e81;
      color: #a5b4fc;
    }

    .tag-urgent {
      background: #881337;
      color: #fda4af;
    }

    .tag-amber {
      background: #78350f;
      color: #fde68a;
    }

    .tag-calm {
      background: #064e3b;
      color: #6ee7b7;
    }

    .footer-note {
      padding-top: 16px;
      border-top: 1px solid #1e293b;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>
      <span>🔔</span>
      <span>NeuraVolt Audio Previewer</span>
    </h1>
    <p class="sub">
      Task notifications ke liye <strong>"Faaa" sound variations</strong> aur normal notifications ke liye
      <strong>3-second auto gentle chimes</strong> suniye:
    </p>

    <!-- SECTION 1: Task Notifications ("Faaa" Style) -->
    <div class="section-title">
      <span>⚡</span>
      <span>Task Manager Alert ("Faaa" Style)</span>
    </div>

    <div class="samples-list">
      <!-- Faaa Option 1 -->
      <button class="sample-btn" onclick="playFaaaFanfare()">
        <div class="sample-info">
          <div class="sample-title">
            <span>🎺 Option 1: Brass Fanfare ("Ta-Daa / Faaa!")</span>
            <span class="tag">High Energy</span>
          </div>
          <div class="sample-desc">Energetic brass trumpet chord burst. Instant attention-grabber.</div>
        </div>
        <div class="play-icon">▶</div>
      </button>

      <!-- Faaa Option 2 -->
      <button class="sample-btn" onclick="playFaaaSwoosh()">
        <div class="sample-info">
          <div class="sample-title">
            <span>🌪️ Option 2: Cyber Swoosh ("Fwoooosh-Faaa!")</span>
            <span class="tag tag-amber">Modern Tech</span>
          </div>
          <div class="sample-desc">Fast rising frequency whoosh with crisp sparkling resonant impact.</div>
        </div>
        <div class="play-icon" style="background: #d97706;">▶</div>
      </button>

      <!-- Faaa Option 3 -->
      <button class="sample-btn" onclick="playFaaaHorn()">
        <div class="sample-info">
          <div class="sample-title">
            <span>📢 Option 3: Bold Alert Horn ("Faaaaa Horn")</span>
            <span class="tag tag-urgent">Bold & Loud</span>
          </div>
          <div class="sample-desc">Deep authoritative brass horn blast. Ekdum loud & clear alert.</div>
        </div>
        <div class="play-icon" style="background: #e11d48;">▶</div>
      </button>
    </div>

    <!-- SECTION 2: Normal Notifications (3-Second Auto) -->
    <div class="section-title" style="color: #10b981;">
      <span>🍃</span>
      <span>Normal Notification (3-Second Auto Fade)</span>
    </div>

    <div class="samples-list" style="margin-bottom: 0;">
      <!-- Normal Option A -->
      <button class="sample-btn" onclick="playNormal3SecAmbient()">
        <div class="sample-info">
          <div class="sample-title">
            <span>🎵 Normal 1: 3-Second Ambient Cascade</span>
            <span class="tag tag-calm">Auto 3 Sec</span>
          </div>
          <div class="sample-desc">Soft harmonic bells jo 3 seconds tak gently shimmer karke auto-fade ho jaate hain.
          </div>
        </div>
        <div class="play-icon" style="background: #059669;">▶</div>
      </button>

      <!-- Normal Option B -->
      <button class="sample-btn" onclick="playNormal3SecCalm()">
        <div class="sample-info">
          <div class="sample-title">
            <span>🌊 Normal 2: 3-Second Gentle Calming Tone</span>
            <span class="tag tag-calm">Auto 3 Sec</span>
          </div>
          <div class="sample-desc">Gentle warm sine tone with 3-second soft release. Zero irritation.</div>
        </div>
        <div class="play-icon" style="background: #0d9488;">▶</div>
      </button>
    </div>

    <div class="footer-note" style="margin-top: 24px;">
      Click any button to play instantly • Web Audio API Synthesizer
    </div>
  </div>

  <script>
    function getAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      return new AudioCtx();
    }

    // 1. Brass Fanfare (Ta-Daa / Faaa!)
    function playFaaaFanfare() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // Grace note "Ta-"
      const graceOsc = ctx.createOscillator();
      const graceGain = ctx.createGain();
      graceOsc.type = 'triangle';
      graceOsc.frequency.setValueAtTime(349.23 /* F4 */, now);
      graceGain.gain.setValueAtTime(0.35, now);
      graceGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      graceOsc.connect(graceGain);
      graceGain.connect(ctx.destination);
      graceOsc.start(now);
      graceOsc.stop(now + 0.08);

      // Main "-Faaa!" Chord (F4, A4, C5, F5)
      const chord = [349.23, 440.0, 523.25, 698.46];
      chord.forEach((freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = now + 0.08;
        const dur = 0.85;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.25, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur);
      });
    }

    // 2. Cyber Swoosh (Fwoooosh-Faaa!)
    function playFaaaSwoosh() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.35);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.85);

      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0.4, now + 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.85);
    }

    // 3. Bold Horn ("Faaaa Alarm")
    function playFaaaHorn() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const freqs = [349.23 /* F4 */, 698.46 /* F5 */];

      freqs.forEach((freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.1);
      });
    }

    // 4. Normal Notification: 3-Second Ambient Cascade (Auto 3s)
    function playNormal3SecAmbient() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const notes = [
        { freq: 523.25 /* C5 */, delay: 0.0 },
        { freq: 659.25 /* E5 */, delay: 0.3 },
        { freq: 783.99 /* G5 */, delay: 0.6 },
      ];

      notes.forEach((note) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = now + note.delay;
        const dur = 3.0 - note.delay;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(note.freq, start);
        gain.gain.setValueAtTime(0.28, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur);
      });
    }

    // 5. Normal Notification: 3-Second Gentle Calming Tone (Auto 3s)
    function playNormal3SecCalm() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(440 /* A4 */, now);
      osc.frequency.linearRampToValueAtTime(466.16 /* A#4 */, now + 1.5);
      osc.frequency.linearRampToValueAtTime(440 /* A4 */, now + 3.0);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 3.0);
    }
  </script>
</body>

</html>
